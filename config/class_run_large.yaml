
model_name: vinai/bertweet-large
dropout_p: 0.1
trials: 20
# cross_val_folds: 7

# Training params
learning_rate: 0.00003
max_epochs: 10
accumulate_grad_batches: 2
stopping_patience: 10
warmup_ratio: 0.1

# Metrics
logs_dir: tb_logs
logs_name: classifier

# Data params
train_data: data/tweets/train_master.csv
test_data: data/tweets/test_master.csv
all_data: data/tweets/all_tweets.csv
batch_size: 32

global_seed: 2025
